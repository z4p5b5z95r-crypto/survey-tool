<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>調查報告桌曆 — 版型 A（專案彙整）</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.vtitle{font-size:13px;color:#475569;margin:0 0 14px;padding:10px 14px;background:#eff6ff;
  border-left:3px solid #2563eb;border-radius:0 8px 8px 0}
.vtitle b{color:#1d4ed8}

/* ── 篩選列 ── */
.filters{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fgroup{display:flex;flex-direction:column;gap:4px}
.fgroup label{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.3px}
.fgroup select{padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;
  font-size:13px;color:#0f172a;min-width:150px;font-family:inherit}
.monthnav{display:flex;align-items:center;gap:6px;margin-left:auto}
.monthnav button{width:34px;height:34px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;
  cursor:pointer;font-size:15px;color:#475569}
.monthnav .mlabel{font-size:16px;font-weight:800;min-width:112px;text-align:center}
.monthnav .today{width:auto;padding:0 12px;font-size:12px;font-weight:700}

/* ── 月曆 ── */
.cal{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;
  border-bottom:1px solid #e2e8f0}
.dow div{padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:#64748b}
.dow div:first-child,.dow div:last-child{color:#dc2626}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:112px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;
  padding:6px;transition:background .12s}
.cell:nth-child(7n){border-right:0}
.cell.blank{background:#fafbfc}
.cell.today{background:#eff6ff}
.dnum{font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
.cell.today .dnum{color:#2563eb}
.cell.wknd .dnum{color:#dc2626}

/* 專案色票 */
.p0{--c:#2563eb;--bg:#eff6ff;--bd:#bfdbfe}
.p1{--c:#16a34a;--bg:#f0fdf4;--bd:#bbf7d0}
.p2{--c:#ea580c;--bg:#fff7ed;--bd:#fed7aa}
.p3{--c:#7c3aed;--bg:#f5f3ff;--bd:#ddd6fe}

/* ── 專案框：一天 × 一個專案 = 一框 ── */
.chip{background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--c);
  border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;transition:.12s}
.chip:hover{filter:brightness(.97);box-shadow:0 1px 5px rgba(15,23,42,.12)}
.chip .top{display:flex;align-items:baseline;gap:5px}
.chip .pj{flex:1;font-size:11px;font-weight:800;color:var(--c);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.chip .rc{flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--c);
  border-radius:20px;padding:1px 6px;line-height:1.5}
.chip .en{font-size:10px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px}
.more{font-size:10px;color:#94a3b8;padding-left:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding:10px 13px;background:#fff;
  border:1px solid #e2e8f0;border-radius:10px;font-size:12px;color:#475569}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}

/* ── 彈出視窗 ── */
.mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
  align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:13px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;
  border-top:4px solid var(--c)}
.mhead .ht{flex:1}
.mhead h3{margin:0;font-size:16px;color:var(--c)}
.mhead .hs{font-size:12px;color:#64748b;margin-top:2px}
.mhead .x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;cursor:pointer;
  font-size:15px;color:#475569;flex:none}
.mbody{padding:12px 16px 16px;overflow-y:auto}
.rrow{border:1px solid #e2e8f0;border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:.12s}
.rrow:hover{background:#f8fafc;border-color:#93c5fd}
.rrow .rn{flex:1;font-size:13px;font-weight:800}
.rrow .rm{font-size:11px;color:#64748b;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.rrow .trips{flex:none;font-size:12px;font-weight:800;color:var(--c);background:var(--bg);
  border:1px solid var(--bd);border-radius:20px;padding:3px 10px;white-space:nowrap}
.rrow .go{flex:none;color:#cbd5e1;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <p class="vtitle"><b>版型 A — 一天 × 一個專案 = 一個框</b>。框內顯示專案名稱、當天調查的
    <b>路線條數</b>（不是趟次）、以及工程師。點框 → 列出該專案當天調查的路線，路線後面才顯示趟次 →
    再點路線 → 進報告頁。</p>

  <div class="filters" id="filters"></div>
  <div class="cal"><div class="dow" id="dow"></div><div class="grid" id="grid"></div></div>
  <div class="legend" id="legend"></div>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal">
    <div class="mhead"><div class="ht"><h3 id="mtitle"></h3><div class="hs" id="msub"></div></div>
      <button class="x" onclick="document.getElementById('mask').classList.remove('on')">✕</button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
// ── 模擬資料 ──
const PROJECTS=[
  {id:'p0',name:'赤城-紅樓城延滯調查',cls:'p0'},
  {id:'p1',name:'歸仁大道',cls:'p1'},
  {id:'p2',name:'台二省道轉新市二路',cls:'p2'},
  {id:'p3',name:'測試路線A',cls:'p3'}
];
const ROUTES={
  p0:['赤城路(北向)','赤城路(南向)','紅樓城環道','中華路匝道'],
  p1:['歸仁大道東段','歸仁大道西段','歸仁大道輔道'],
  p2:['台二省道轉新市二路到港子平','新市二路南段'],
  p3:['測試路線A測B','測試路線A測C']
};
const ENG=['邱健峻','T19080','Seb導航測試','穎逸'];
const WEA=['☀️','☁️','🌧️'];

// 一筆 = 某天某路線的一次調查（同一路線同天可能多趟）
const DATA=[];
(function(){
  let seed=11; const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let d=1; d<=31; d++){
    if(rnd()<0.40) continue;
    const npj=1+Math.floor(rnd()*2.4);
    const picked=[];
    for(let i=0;i<npj;i++){
      const p=PROJECTS[Math.floor(rnd()*PROJECTS.length)];
      if(picked.includes(p.id)) continue; picked.push(p.id);
      const rs=ROUTES[p.id];
      const nr=1+Math.floor(rnd()*rs.length);        // 當天跑了幾條路線
      const used=[];
      for(let k=0;k<nr;k++){
        const rt=rs[Math.floor(rnd()*rs.length)];
        if(used.includes(rt)) continue; used.push(rt);
        DATA.push({
          date:`2026-08-${String(d).padStart(2,'0')}`,
          projectId:p.id, project:p.name, cls:p.cls, route:rt,
          engineer:ENG[Math.floor(rnd()*ENG.length)],
          weather:WEA[Math.floor(rnd()*3)],
          trips:1+Math.floor(rnd()*4),
          time:`${9+Math.floor(rnd()*8)}:${String(Math.floor(rnd()*60)).padStart(2,'0')}`
        });
      }
    }
  }
})();

let filt={project:'',engineer:''};
const rows=()=>DATA.filter(r=>(!filt.project||r.projectId===filt.project)
                            &&(!filt.engineer||r.engineer===filt.engineer));

// 把某天的紀錄依「專案」彙整成一個框
function groupByProject(list){
  const m=new Map();
  list.forEach(r=>{
    if(!m.has(r.projectId)) m.set(r.projectId,
      {projectId:r.projectId, project:r.project, cls:r.cls, routes:new Map(), engineers:new Set()});
    const g=m.get(r.projectId);
    g.engineers.add(r.engineer);
    if(!g.routes.has(r.route)) g.routes.set(r.route,{route:r.route, trips:0, recs:[]});
    const rr=g.routes.get(r.route);
    rr.trips+=r.trips; rr.recs.push(r);
  });
  return [...m.values()];
}

function filterBar(){
  document.getElementById('filters').innerHTML=`
    <div class="fgroup"><label>專案</label><select data-k="project">
      <option value="">全部專案</option>
      ${PROJECTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
    </select></div>
    <div class="fgroup"><label>工程師</label><select data-k="engineer">
      <option value="">全部工程師</option>
      ${ENG.map(e=>`<option value="${e}">${e}</option>`).join('')}
    </select></div>
    <div class="monthnav">
      <button title="上個月">‹</button>
      <div class="mlabel">2026年 8月</div>
      <button title="下個月">›</button>
      <button class="today">本月</button>
    </div>`;
  document.querySelectorAll('#filters select').forEach(s=>{
    s.value=filt[s.dataset.k];
    s.onchange=()=>{ filt[s.dataset.k]=s.value; render() };
  });
}

const FIRST=6, DAYS=31;   // 2026-08-01 是週六
function render(){
  filterBar();
  document.getElementById('dow').innerHTML=
    ['日','一','二','三','四','五','六'].map(d=>`<div>${d}</div>`).join('');
  document.getElementById('legend').innerHTML=
    PROJECTS.map(p=>`<span class="lg ${p.cls}"><i></i>${p.name}</span>`).join('');

  let h='';
  for(let i=0;i<FIRST;i++) h+='<div class="cell blank"></div>';
  for(let d=1; d<=DAYS; d++){
    const date=`2026-08-${String(d).padStart(2,'0')}`;
    const groups=groupByProject(rows().filter(r=>r.date===date));
    const dw=(FIRST+d-1)%7, wknd=(dw===0||dw===6)?' wknd':'';
    const today=date==='2026-08-14'?' today':'';
    const show=groups.slice(0,2).map(g=>`
      <div class="chip ${g.cls}" onclick="openDay('${date}','${g.projectId}')">
        <div class="top">
          <span class="pj">${g.project}</span>
          <span class="rc">${g.routes.size} 條</span>
        </div>
        <div class="en">${[...g.engineers].join('、')}</div>
      </div>`).join('');
    h+=`<div class="cell${wknd}${today}"><div class="dnum">${d}</div>${show}
        ${groups.length>2?`<div class="more">＋${groups.length-2} 個專案</div>`:''}</div>`;
  }
  const tail=(FIRST+DAYS)%7; if(tail) for(let i=tail;i<7;i++) h+='<div class="cell blank"></div>';
  document.getElementById('grid').innerHTML=h;
}

function openDay(date, pid){
  const g=groupByProject(rows().filter(r=>r.date===date&&r.projectId===pid))[0];
  if(!g) return;
  const list=[...g.routes.values()];
  document.getElementById('modal').className='modal '+g.cls;
  document.getElementById('mtitle').textContent=g.project;
  document.getElementById('msub').textContent=
    `${date.replace(/-/g,'/')}　共 ${list.length} 條路線・${[...g.engineers].join('、')}`;
  document.getElementById('mbody').innerHTML=list.map(r=>{
    const rec=r.recs[0];
    return `<div class="rrow" onclick="alert('→ 開啟調查報告\\n\\n${r.route}\\n${g.project}\\n${date}')">
      <div style="flex:1">
        <div class="rn">${r.route}</div>
        <div class="rm"><span>👷 ${[...new Set(r.recs.map(x=>x.engineer))].join('、')}</span>
          <span>${rec.weather}</span><span>🕘 ${rec.time}</span></div>
      </div>
      <span class="trips">${r.trips} 趟</span>
      <span class="go">›</span>
    </div>`;
  }).join('');
  document.getElementById('mask').classList.add('on');
}
document.getElementById('mask').onclick=e=>{
  if(e.target.id==='mask') e.currentTarget.classList.remove('on');
};
render();
</script>
</body>
</html>
